version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: iems-db
    environment:
      MYSQL_ROOT_PASSWORD: rrrrr2005
      MYSQL_DATABASE: iems_db
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prrrrr2005"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - mysql-data:/var/lib/mysql

  backend:
    build: ./demo
    container_name: iems-backend
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/iems_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: rrrrr2005
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: iems-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  mysql-data:
